[project]
name = "whattoplaynext-api"
version = "0.1.0"
description = "Provider-neutral game discovery API"
authors = [{ name = "ffelipe.alves", email = "felipe.alves0850@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]

[tool.poetry]
packages = [{ include = "whattoplaynext_api", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["whattoplaynext_api"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
